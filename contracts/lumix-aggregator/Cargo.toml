[package]
name = "lumix-aggregator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# SDK 29 and the existing workspace's SDK 27 pin incompatible VM versions.
# Keep this single new contract independent of the existing contracts.
[workspace]

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=29.0.1"

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }
proptest = "1.5"
serde_json = "1"
sha2 = "=0.10.9"

[features]
wasm-tests = []

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

